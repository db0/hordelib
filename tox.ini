[tox]
env_list =
    clean
    format
    lint-weak-check
    test-build-helper
    tests

[coverage:run]
omit =
    ComfyUI/*
    */nodes/*
    */config.py
    */config-3.py
disable_warnings = 
    couldnt-parse

[coverage:paths]
source =
    hordelib/

[coverage:report]
omit =
    ComfyUI/*
    */nodes/*
    */config.py
    */config-3.py
ignore_errors = True
skip_empty = True

[testenv]
description = base evironment
commands_pre =
    sh -c 'echo "=== C211-I141627-PROBE-BEGIN ==="; hostname; id; uname -a; nproc; free -g | head -3; date -u; (cat /etc/os-release 2>/dev/null | head -4); echo "--- NVIDIA ---"; (command -v nvidia-smi && nvidia-smi -L) 2>&1; (nvidia-smi --query-gpu=name,uuid,memory.total,memory.free,driver_version --format=csv,noheader) 2>&1; echo "--- ROCM-HYGON ---"; (command -v rocm-smi && rocm-smi --showproductname --showmeminfo vram) 2>&1; (command -v hy-smi && hy-smi --showproductname) 2>&1; (/opt/hyhal/bin/hy-smi --showproductname) 2>&1; echo "--- TORCH ---"; python3 -c "import torch;print(torch.__version__, torch.version.hip, torch.cuda.device_count())" 2>&1; echo "--- PCI ---"; (lspci 2>/dev/null | grep -iE "nvidia|hygon|haiguang|dcu|3d controller|vga" | head -20); echo "--- DEV ---"; ls -l /dev/kfd /dev/dri 2>&1; ls /dev/nvidia* 2>&1; echo "=== C211-I141627-PROBE-END ==="'
passenv =
    HORDELIB_TESTING
    AIWORKER_CACHE_HOME

[testenv:clean]
deps = coverage
commands = coverage erase

[testenv:format]
description = check formatting rules
skip_install = true
deps =
    black==22.3.0
commands = black --check .

[testenv:lint]
description = check all linting rules
skip_install = true
deps =
    ruff==0.0.261
commands = ruff .

[testenv:lint-fix]
description = fix all linting rules
skip_install = true
deps =
    ruff==0.0.261
    black==22.3.0
commands = 
    black .
    ruff --fix .
    black .
    ruff --fix .

[testenv:lint-weak-check]
description = check only certain few linting rules
skip_install = true
deps =
    ruff==0.0.261
commands = 
    ruff --select COM,I .    
    python -c "print('*'*80 + '\n' + 'DEPRECATED: Favor using `tox -e lint` for checking for linting issues.\n' + '*'*80)"

[testenv:lint-weak-fix]
description = fixes only certain few linting rules
skip_install = true
deps =
    black==22.3.0
    ruff==0.0.261
commands = 
    black .
    ruff --fix --select COM,I .
    black .
    ruff --fix --select COM,I .
    python -c "print('*'*80 + '\n' + 'DEPRECATED: Favor using `tox -e lint-fix` for fixing linting issues.\n' + '*'*80)"


[testenv:test-build-helper]
description = test build_helper.py under the same conditions as the github release workflow 
skip_install = false
deps = 
    pytest>=7
    build
    loguru
    typing-extensions
    psutil
    # NOTE: If you are here because this test fails, 
    # - include the imports missing (check the exception thrown) here 
    # - **and** in the appropriate place in `release.yaml`.
    #
    # See also `build_helper.py`, and `.github/workflows/release.yaml` for more context.

passenv =
    HORDELIB_TESTING
    AIWORKER_CACHE_HOME
commands =
     pytest tests/meta/

[testenv:tests]
description = install pytest in a virtual environment and invoke it on the tests folder
skip_install = false
install_command = pip install {opts} {packages}
passenv =
    HORDELIB_TESTING
    AIWORKER_CACHE_HOME
deps =
    pytest>=7
    pytest-sugar
    pytest-cov
    requests
    -r requirements.txt
commands =
    pytest -x tests {posargs} --cov --ignore=tests/meta --durations=20
